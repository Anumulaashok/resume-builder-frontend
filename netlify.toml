# Netlify Deployment Configuration for Resume Builder Frontend

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  REACT_APP_API_URL = "https://resume-builder-backend-eight-swart.vercel.app"

# API proxy rewrite rule: forward /api requests to backend service
[[redirects]]
  from = "/api/*"
  to = "https://resume-builder-backend-eight-swart.vercel.app/api/:splat"
  status = 200
  force = true

# Client-side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
